name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, input-gameplay, experiment/artwork-dedither]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.event_name == 'pull_request'
    name: Linux ${{ matrix.build-type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ github.event_name == 'push' && fromJSON('["Release", "Debug"]') || fromJSON('["Release"]') }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify original frontend font AA integration
        run: python3 tests/frontend_font_smoothing_regression.py

      - name: Test high-quality frontend font reconstruction
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Isrc \
            tests/frontend_font_aa_regression.c src/xwa_remaster/frontend_font_aa.c \
            -lm -o /tmp/xwa-font-aa-test
          /tmp/xwa-font-aa-test

      - name: Determine short commit hash
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build package
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/linux/Dockerfile
          platforms: linux/amd64
          target: artifact
          build-args: |
            XWA_BUILD_TYPE=${{ matrix.build-type }}
            XWA_VERSION=${{ steps.sha.outputs.short }}
          outputs: type=local,dest=build/artifacts
          cache-from: type=gha,scope=linux
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=linux' || '' }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openxwa-linux-x86_64-${{ matrix.build-type == 'Debug' && 'debug' || 'release' }}
          path: build/artifacts/*.tar.xz
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.build-type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One Windows Release for the isolated artwork experiment.
        build-type: ${{ github.event_name == 'push' && github.ref != 'refs/heads/experiment/artwork-dedither' && fromJSON('["Release", "Debug"]') || fromJSON('["Release"]') }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify Hyperdrive lever thresholds and one-shot semantics
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Isrc \
            tests/hyperdrive_axis_regression.c -o /tmp/xwa-hyperdrive-test
          /tmp/xwa-hyperdrive-test

      - name: Verify orientation math regressions
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Isrc \
            tests/orientation_regression.c src/xwa_runtime/hooks/orientation_hook.c \
            -lm -o /tmp/xwa-orientation-test
          /tmp/xwa-orientation-test

      - name: Verify motion and docking precision regressions
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Isrc \
            tests/motion_regression.c -o /tmp/xwa-motion-test
          /tmp/xwa-motion-test

      - name: Verify fixed ventral turret mount under head tracking
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Isrc \
            tests/turret_mount_regression.c -lm -o /tmp/xwa-turret-test
          /tmp/xwa-turret-test

      - name: Verify native turret camera, reticle and projectile alignment
        run: |
          python3 tests/turret_firing_alignment_regression.py

      - name: Verify turret sensitivity and low-lag response
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Isrc \
            tests/turret_aim_regression.c -lm -o /tmp/xwa-turret-aim-test
          /tmp/xwa-turret-aim-test

      - name: Verify original frontend font AA integration
        run: python3 tests/frontend_font_smoothing_regression.py

      - name: Test high-quality frontend font reconstruction
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Isrc \
            tests/frontend_font_aa_regression.c src/xwa_remaster/frontend_font_aa.c \
            -lm -o /tmp/xwa-font-aa-test
          /tmp/xwa-font-aa-test

      - name: Verify optional artwork restoration reaches frontend drawing
        run: python3 tests/artwork_restoration_integration.py

      - name: Test artwork restoration on dithering, edges and alpha
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Isrc \
            tests/artwork_restoration_regression.c src/xwa_remaster/artwork_restoration.c \
            -o /tmp/xwa-artwork-restoration-test
          /tmp/xwa-artwork-restoration-test

      - name: Determine short commit hash
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build package
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/windows/Dockerfile
          platforms: linux/amd64
          target: artifact
          build-args: |
            XWA_BUILD_TYPE=${{ matrix.build-type }}
            XWA_VERSION=${{ steps.sha.outputs.short }}
          outputs: type=local,dest=build/artifacts
          cache-from: type=gha,scope=windows
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=windows' || '' }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openxwa-windows-x86_64-${{ matrix.build-type == 'Debug' && 'debug' || 'release' }}
          path: build/artifacts/*.zip
          if-no-files-found: error

  macos:
    if: github.event_name == 'pull_request'
    name: macOS ${{ matrix.build-type }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ github.event_name == 'push' && fromJSON('["Release", "Debug"]') || fromJSON('["Release"]') }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine short commit hash
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: brew install cmake ninja pkg-config

      - name: Determine runner image version
        id: runner-image
        run: echo "version=${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency caches
        uses: actions/cache@v6
        with:
          path: |
            build/cache/macos-arm64/sources
            build/cache/macos-arm64/dependencies
            build/cache/macos-arm64/tools
            build/cache/macos-arm64/build/sdl
            build/cache/macos-arm64/build/zstd
            build/cache/macos-arm64/build/ffmpeg
            build/cache/macos-arm64/build/shadercross
          key: macos-arm64-${{ steps.runner-image.outputs.version }}-deps-${{ hashFiles('packaging/macos/build-package.sh', 'packaging/common/shadercross-fsr3.patch') }}

      - name: Build package
        env:
          XWA_BUILD_TYPE: ${{ matrix.build-type }}
          XWA_VERSION: ${{ steps.sha.outputs.short }}
        run: ./packaging/macos/build-package.sh

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openxwa-macos-arm64-${{ matrix.build-type == 'Debug' && 'debug' || 'release' }}
          path: build/artifacts/*.dmg
          if-no-files-found: error
