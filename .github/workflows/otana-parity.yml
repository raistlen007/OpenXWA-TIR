name: Otana cockpit math (no game build)

on:
  push:
    branches: [otana-ventral-classic-parity]
  workflow_dispatch:

jobs:
  classic-parity:
    name: Compile and verify classic lower-turret pivot
    runs-on: ubuntu-latest
    steps:
      - name: Check out game source only
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Compile standalone native cockpit parity test
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Isrc tests/turret_mount_regression.c -lm -o /tmp/otana-parity-test
          /tmp/otana-parity-test
      - name: Verify Otana-only source boundaries
        run: python3 tests/turret_firing_alignment_regression.py
